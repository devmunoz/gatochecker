<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GatoChecker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>🐱 GatoChecker</h1>
  <div class="controls">
    <label>Auto:
      <select id="interval">
        <option value="0">Off</option>
        <option value="5000">5s</option>
        <option value="10000">10s</option>
        <option value="30000">30s</option>
        <option value="60000">60s</option>
      </select>
    </label>
    <button id="refresh">Refresh</button>
    <button id="open-admin" title="Settings">⚙️</button>
  </div>
</header>
<main id="grid"></main>

<dialog id="admin">
  <h2>Settings</h2>
  <div class="field">
    <label for="cfg-refresh">Default refresh</label>
    <select id="cfg-refresh">
      <option value="0">Off</option>
      <option value="5000">5s</option>
      <option value="10000">10s</option>
      <option value="30000">30s</option>
      <option value="60000">60s</option>
    </select>
  </div>
  <div class="field">
    <label>Cameras (`hosts.json`)</label>
    <ul id="host-list"></ul>
    <div class="add-row">
      <input id="new-host" placeholder="e.g. 192.168.1.50 or camera.local">
      <button type="button" id="add-host">+ Add</button>
    </div>
  </div>
  <div class="dialog-actions">
    <button type="button" id="cancel-admin">Cancel</button>
    <button type="button" id="save-admin">Save</button>
  </div>
</dialog>

<dialog id="zoom">
  <div class="cam-bar">
    <div class="cam-links">
      <strong id="zoom-title"></strong>
      <button type="button" class="icon-btn live-btn" id="zoom-live" title="Toggle live RTSP stream">▶</button>
      <button type="button" class="icon-btn" id="zoom-refresh" title="Refresh snapshot">🔄</button>
      <span class="cat-badge" id="zoom-cat-badge" title="Cat detected"></span>
    </div>
    <button type="button" id="close-zoom">✕</button>
  </div>
  <div class="zoom-viewport">
    <div class="cat-boxes" id="zoom-cat-boxes"></div>
  </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
