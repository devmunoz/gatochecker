services:
  gatochecker:
    build:
      context: .
      # args:
      #   TORCH_INDEX: cuda  # Uncomment to build with NVIDIA CUDA support
    image: gatochecker:latest
    container_name: gatochecker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - GATO_CONFIG=/app/data/config.json
      # - DEBUG=1  # Optional: enable detailed ML detection logs
      # - DEVICE=cuda  # Optional: force cuda, mps, or cpu
      # - YOLO_MODEL=rtdetr-l.pt  # Optional: rtdetr-l.pt, yolo11s.pt, etc.
    # deploy:  # Uncomment for NVIDIA GPU passthrough (requires nvidia-container-toolkit)
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
